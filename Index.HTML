<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road, Refuse and Flood Alert System – Calabar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#12302f;--card:#fff;--line:#d9d3c5;--acc:#e8590c;--flood:#1c7ed6;--road:#e8590c;--refuse:#2f9e44}
@media(prefers-color-scheme:dark){:root{--bg:#0e1f1e;--ink:#eef2ee;--card:#173533;--line:#2c4b49}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
header{padding:28px 18px 8px;max-width:760px;margin:auto}
h1{font-size:clamp(28px,7vw,44px);line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
header p{margin:0;opacity:.75}
nav{display:flex;gap:6px;max-width:760px;margin:14px auto 0;padding:0 18px;overflow-x:auto}
nav button{flex:1;padding:10px 12px;border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:999px;font:inherit;font-weight:600;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
main{max-width:760px;margin:auto;padding:16px 18px 60px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
textarea{min-height:90px}
.btn{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.btn.sm{width:auto;margin:0;padding:6px 12px;font-size:14px}
#map{height:240px;border-radius:12px;margin-top:6px;border:1px solid var(--line)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;font-size:13px;font-weight:600}
.road{background:var(--road)}.refuse{background:var(--refuse)}.flood{background:var(--flood)}
.st{font-weight:800}
.meta{opacity:.7;font-size:14px}
.note{font-size:14px;opacity:.7;margin-top:18px}
.ok{background:#2f9e4422;border:1px solid #2f9e44;padding:12px;border-radius:10px;margin-top:12px}
</style>
</head>
<body>
<header>
<h1>Road, Refuse and Flood Alert System</h1>
<p>Report a problem in Calabar and track it until it is fixed.</p>
</header>
<nav id="tabs">
<button data-t="report" class="on">Report</button>
<button data-t="track">Track</button>
<button data-t="alerts">Alerts</button>
<button data-t="admin">Admin</button>
</nav>
<main>

<section id="report" class="on">
<div class="card">
<label for="type">What are you reporting?</label>
<select id="type"><option value="flood">Flooding</option><option value="road">Damaged road</option><option value="refuse">Uncollected refuse</option></select>
<label for="loc">Street or area</label>
<input id="loc" placeholder="e.g. Ekpo Abasi Street">
<label>Tap the map to mark the spot</label>
<div id="map"></div>
<label for="desc">Describe the problem</label>
<textarea id="desc"></textarea>
<label for="name">Your name (optional)</label>
<input id="name">
<button class="btn" id="send">Submit report</button>
<div id="done"></div>
</div>
</section>

<section id="track">
<div class="card">
<label for="ref">Reference number</label>
<input id="ref" placeholder="e.g. RRF-1042">
<button class="btn" id="find">Check status</button>
<div id="result"></div>
</div>
</section>

<section id="alerts">
<div id="alist"></div>
</section>

<section id="admin">
<div class="card">
<p class="meta">Demo admin view. Change the status of any report.</p>
<div id="adm"></div>
</div>
</section>

<p class="note">Demo version. Reports are saved only in this browser. The full PHP version (with real logins, shared database and agencies) needs PHP hosting.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const STAT=['Received','In progress','Resolved'];
const NAMES={flood:'Flooding',road:'Damaged road',refuse:'Uncollected refuse'};
const SEED=[
{ref:'RRF-1001',type:'flood',loc:'Marian Road',desc:'Water covering both lanes after rain.',status:1,t:Date.now()-864e5*2},
{ref:'RRF-1002',type:'road',loc:'Mayne Avenue',desc:'Large pothole near the junction.',status:0,t:Date.now()-864e5},
{ref:'RRF-1003',type:'refuse',loc:'Atimbo Road',desc:'Bins not emptied for two weeks.',status:2,t:Date.now()-864e5*4}];
let data;
try{data=JSON.parse(localStorage.getItem('rrfas'))}catch(e){}
if(!data)data=SEED;
const save=()=>{try{localStorage.setItem('rrfas',JSON.stringify(data))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const row=r=>`<div class="card"><span class="tag ${r.type}">${NAMES[r.type]}</span> <span class="st">${STAT[r.status]}</span>
<div><b>${esc(r.loc)}</b> <span class="meta">· ${r.ref} · ${new Date(r.t).toLocaleDateString()}</span></div><div>${esc(r.desc)}</div></div>`;

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));
 b.classList.add('on');$(b.dataset.t).classList.add('on');
 if(b.dataset.t==='report')setTimeout(()=>map.invalidateSize(),50);
 render();
});

const map=L.map('map').setView([4.9517,8.3220],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
let pin=null;
map.on('click',e=>{if(pin)map.removeLayer(pin);pin=L.marker(e.latlng).addTo(map)});

$('send').onclick=()=>{
 if(!$('loc').value.trim()||!$('desc').value.trim()){alert('Please enter the area and a description.');return}
 const ref='RRF-'+(1000+data.length+1+Math.floor(Math.random()*9));
 data.unshift({ref,type:$('type').value,loc:$('loc').value,desc:$('desc').value,status:0,t:Date.now(),
  ll:pin?[pin.getLatLng().lat,pin.getLatLng().lng]:null});
 save();
 $('done').innerHTML=`<div class="ok">Report received. Your reference number is <b>${ref}</b>. Use it on the Track tab.</div>`;
 $('loc').value=$('desc').value=$('name').value='';
 if(pin){map.removeLayer(pin);pin=null}
 render();
};

$('find').onclick=()=>{
 const r=data.find(x=>x.ref.toLowerCase()===$('ref').value.trim().toLowerCase());
 $('result').innerHTML=r?row(r):'<p>No report found with that number.</p>';
};

function render(){
 $('alist').innerHTML=data.filter(r=>r.status<2).map(row).join('')||'<div class="card">No active alerts.</div>';
 $('adm').innerHTML=data.map((r,i)=>row(r)+`<div style="margin:-6px 0 12px"><select data-i="${i}" style="width:auto">${STAT.map((s,k)=>`<option value="${k}"${k===r.status?' selected':''}>${s}</option>`).join('')}</select></div>`).join('');
 document.querySelectorAll('#adm select').forEach(s=>s.onchange=()=>{data[s.dataset.i].status=+s.value;save();render()});
}
render();
</script>
</body>
</html>
